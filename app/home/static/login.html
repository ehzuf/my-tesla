<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/static/manifest.json">
  <title>登录 · My Tesla</title>
<link rel="stylesheet" href="/static/css/login-page.css?v=2">
</head>
<body>
<div class="card" id="card">
  <!-- 品牌图标 = Tesla T 标 (2026-10-12 用户点名红白配色 + 边缘留白;
       与向导/应用壳同一枚, 拆仓时门厅层原样拷自 My Home 的 🔑 退役) -->
  <div class="icon">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#fff" d="M12 5.362l2.475-3.026s4.245.09 8.471 2.054c-1.082 1.636-3.231 2.438-3.231 2.438-.146-1.439-1.154-1.79-4.354-1.79L12 24 8.619 5.034c-3.18 0-4.188.354-4.335 1.792 0 0-2.146-.795-3.229-2.43C5.28 2.431 9.525 2.34 9.525 2.34L12 5.362l-.004.002H12v-.002zm0-3.899c3.415-.03 7.326.528 11.328 2.28.535-.968.672-1.395.672-1.395C19.625.612 15.528.015 12 0 8.472.015 4.375.61 0 2.349c0 0 .195.525.672 1.396C4.674 1.989 8.585 1.435 12 1.46v.003z"/>
    </svg>
  </div>
  <h1>My Tesla</h1>
  <div class="sub" id="sub">请登录后查看</div>
  <form id="form" autocomplete="on">
    <div class="field">
      <label for="user">账号</label>
      <input id="user" name="username" type="text" autocapitalize="off"
             autocorrect="off" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="pass">密码</label>
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="eye-btn" id="eye" aria-label="显示密码">
        <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <button class="btn" id="btn" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script src="/static/login.js?v=4"></script>
</body>
</html>
